<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Narrow Way - A Journey with Christ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        /* 3D Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        #ui-overlay > * {
            pointer-events: auto;
        }

        /* HUD - Top Bar */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
        }

        #chapter-indicator {
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        #xp-display {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .xp-item {
            background: rgba(255, 215, 0, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .streak {
            color: #ff6347;
            font-weight: bold;
        }

        /* Menu Button */
        #menu-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 215, 0, 0.3);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        #menu-btn:hover {
            background: rgba(255, 215, 0, 0.5);
            transform: scale(1.05);
        }

        /* Dialogue Box */
        #dialogue-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8), inset 0 0 20px rgba(255, 215, 0, 0.2);
            opacity: 0;
            transition: opacity 0.5s;
            cursor: pointer;
        }

        #dialogue-container.visible {
            opacity: 1;
        }

        #character-name {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.9);
            letter-spacing: 1px;
        }

        #dialogue-text {
            font-size: 18px;
            line-height: 1.6;
            color: #f0f0f0;
            min-height: 80px;
        }

        #continue-indicator {
            position: absolute;
            bottom: 10px;
            right: 20px;
            color: #ffd700;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Character Portrait */
        #character-portrait {
            position: absolute;
            bottom: 200px;
            left: 50px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            display: none;
            transition: all 0.5s;
        }

        #character-portrait.visible {
            display: block;
        }

        .portrait-jesus { background: radial-gradient(circle, #fff9e6, #ffd700); }
        .portrait-satan { background: radial-gradient(circle, #8b0000, #000); }
        .portrait-narrator { background: radial-gradient(circle, #4682b4, #191970); }
        .portrait-god { background: radial-gradient(circle, #fff, #87ceeb); }
        .portrait-disciples { background: radial-gradient(circle, #8fbc8f, #228b22); }
        .portrait-pharisees { background: radial-gradient(circle, #daa520, #8b4513); }
        .portrait-angels { background: radial-gradient(circle, #fff, #ffe4b5); }

        /* Choice Buttons */
        #choices-container {
            position: absolute;
            bottom: 250px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        #choices-container.visible {
            display: flex;
        }

        .choice-btn {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.9), rgba(50, 50, 50, 0.9));
            border: 2px solid #888;
            color: #fff;
            padding: 18px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .choice-btn:hover {
            transform: scale(1.03);
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.7);
        }

        .choice-btn.narrow-path {
            border-color: #ffd700;
            background: linear-gradient(135deg, rgba(60, 50, 20, 0.9), rgba(80, 70, 30, 0.9));
        }

        .choice-btn.narrow-path:hover {
            box-shadow: 0 0 35px rgba(255, 215, 0, 1);
        }

        .choice-btn.wide-path {
            border-color: #dc143c;
            background: linear-gradient(135deg, rgba(40, 10, 10, 0.9), rgba(60, 20, 20, 0.9));
        }

        .choice-btn.wide-path:hover {
            box-shadow: 0 0 25px rgba(220, 20, 60, 0.7);
        }

        /* Menu Overlay */
        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #menu-overlay.visible {
            display: flex;
        }

        #menu-content {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
        }

        #menu-content h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
        }

        .menu-btn {
            display: block;
            width: 100%;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu-btn:hover {
            background: rgba(255, 215, 0, 0.4);
            transform: scale(1.02);
        }

        /* Save/Load Slots */
        .save-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .save-slot {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .save-slot:hover {
            background: rgba(255, 215, 0, 0.3);
        }

        .save-slot.empty {
            opacity: 0.5;
            border-color: #555;
        }

        /* Achievement Notification */
        #achievement-notification {
            position: fixed;
            top: -200px;
            right: 20px;
            width: 320px;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            border: 3px solid #ffd700;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
            transition: top 0.5s;
            z-index: 200;
        }

        #achievement-notification.visible {
            top: 80px;
        }

        #achievement-notification h3 {
            color: #ffd700;
            margin-bottom: 10px;
            font-size: 18px;
        }

        /* XP Gain Popup */
        #xp-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 215, 0, 0.95);
            color: #000;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 0 50px rgba(255, 215, 0, 1);
            z-index: 150;
            transition: transform 0.3s;
        }

        #xp-popup.visible {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Fade Overlay for Transitions */
        #fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
        }

        #fade-overlay.visible {
            opacity: 1;
        }

        /* Path Map */
        #path-map-container {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #path-map-container.visible {
            display: flex;
        }

        #path-canvas {
            border: 2px solid #ffd700;
            border-radius: 10px;
            background: #1a1a1a;
        }

        /* Verses Collection */
        #verses-container {
            display: none;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
        }

        #verses-container.visible {
            display: flex;
        }

        .verse-card {
            background: linear-gradient(135deg, #2d2d2d, #1a1a1a);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .verse-card h4 {
            color: #ffd700;
            margin-bottom: 10px;
        }

        .verse-card p {
            line-height: 1.6;
            color: #e0e0e0;
        }

        /* Achievements List */
        #achievements-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
        }

        #achievements-container.visible {
            display: flex;
        }

        .achievement-item {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #555;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .achievement-item.unlocked {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .achievement-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .achievement-item.unlocked .achievement-icon {
            background: #ffd700;
        }

        /* Volume Control */
        #volume-control {
            margin: 20px 0;
        }

        #volume-slider {
            width: 100%;
            margin-top: 10px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            #dialogue-container {
                width: 95%;
                padding: 20px;
            }

            #dialogue-text {
                font-size: 16px;
                min-height: 60px;
            }

            #character-portrait {
                width: 80px;
                height: 80px;
                left: 20px;
                bottom: 180px;
            }

            .choice-btn {
                padding: 15px 20px;
                font-size: 14px;
            }

            #menu-content {
                padding: 25px;
            }

            .save-slots {
                grid-template-columns: 1fr;
            }

            #hud {
                font-size: 12px;
                padding: 0 10px;
            }

            .xp-item {
                padding: 4px 8px;
                font-size: 12px;
            }
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-screen h1 {
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
        }

        #loading-screen p {
            color: #fff;
            font-size: 20px;
            font-style: italic;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 30px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <h1>The Narrow Way</h1>
        <p>"Enter through the narrow gate..." - Matthew 7:13</p>
        <div class="spinner"></div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- HUD -->
        <div id="hud">
            <div id="chapter-indicator">Chapter 1: The Incarnation</div>
            <div id="xp-display">
                <div class="xp-item">XP: <span id="xp-value">0</span></div>
                <div class="xp-item streak">Streak: <span id="streak-value">0</span>x</div>
            </div>
        </div>

        <!-- Menu Button -->
        <button id="menu-btn">MENU</button>

        <!-- Character Portrait -->
        <div id="character-portrait"></div>

        <!-- Dialogue Container -->
        <div id="dialogue-container">
            <div id="character-name">Narrator</div>
            <div id="dialogue-text"></div>
            <div id="continue-indicator">▼ Click to continue</div>
        </div>

        <!-- Choices Container -->
        <div id="choices-container"></div>
    </div>

    <!-- Fade Overlay -->
    <div id="fade-overlay"></div>

    <!-- XP Popup -->
    <div id="xp-popup"></div>

    <!-- Achievement Notification -->
    <div id="achievement-notification">
        <h3>🏆 Achievement Unlocked!</h3>
        <p id="achievement-text"></p>
    </div>

    <!-- Menu Overlay -->
    <div id="menu-overlay">
        <div id="menu-content">
            <h2>Menu</h2>
            <button class="menu-btn" onclick="game.showSaveLoad('save')">Save Game</button>
            <button class="menu-btn" onclick="game.showSaveLoad('load')">Load Game</button>
            <button class="menu-btn" onclick="game.showAchievements()">Achievements</button>
            <button class="menu-btn" onclick="game.showVerses()">Scripture Collection</button>
            <button class="menu-btn" onclick="game.showPathMap()">Path Map</button>
            
            <div id="volume-control">
                <label for="volume-slider">Volume</label>
                <input type="range" id="volume-slider" min="0" max="100" value="50">
            </div>

            <button class="menu-btn" onclick="game.closeMenu()">Resume</button>

            <!-- Save/Load View -->
            <div id="save-load-view" style="display: none;">
                <h3 id="save-load-title">Save Game</h3>
                <div class="save-slots">
                    <div class="save-slot" onclick="game.handleSaveLoad(0)">
                        <div>Slot 1</div>
                        <div class="slot-info" id="slot-0">Empty</div>
                    </div>
                    <div class="save-slot" onclick="game.handleSaveLoad(1)">
                        <div>Slot 2</div>
                        <div class="slot-info" id="slot-1">Empty</div>
                    </div>
                    <div class="save-slot" onclick="game.handleSaveLoad(2)">
                        <div>Slot 3</div>
                        <div class="slot-info" id="slot-2">Empty</div>
                    </div>
                </div>
                <button class="menu-btn" onclick="game.backToMainMenu()">Back</button>
            </div>

            <!-- Achievements View -->
            <div id="achievements-container"></div>

            <!-- Verses View -->
            <div id="verses-container"></div>

            <!-- Path Map View -->
            <div id="path-map-container">
                <canvas id="path-canvas" width="500" height="400"></canvas>
                <button class="menu-btn" onclick="game.backToMainMenu()" style="margin-top: 20px;">Back</button>
            </div>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Main Game Script -->
    <script>
        // ===== GAME STATE =====
        const game = {
            currentChapter: 0,
            currentLine: 0,
            xp: 0,
            streak: 0,
            choices: [],
            unlockedAchievements: [],
            collectedVerses: [],
            audioContext: null,
            currentSound: null,
            volume: 0.5,
            typewriterActive: false,
            saveLoadMode: null,
            pathData: { narrow: 0, wide: 0, choices: [] }
        };

        // ===== STORY DATA =====
        const story = {
            chapters: [
                {
                    // Chapter 1: The Incarnation
                    title: "Chapter 1: The Incarnation",
                    location: 0, // Bethlehem
                    atmosphere: "divine",
                    lines: [
                        { speaker: "Narrator", text: "In the beginning was the Word, and the Word was with God, and the Word was God. All things were made through Him, and without Him nothing was made that was made." },
                        { speaker: "Narrator", text: "But now, a choice stands before the divine. The world groans in sin and darkness, awaiting redemption. How shall salvation come?" },
                        { speaker: "God the Father", text: "The time has come. The world needs a Savior. But the path to redemption requires sacrifice beyond measure." },
                        { speaker: "Narrator", text: "A choice must be made. How will the Son enter the world?" }
                    ],
                    choice: {
                        question: "How will the Son of God enter the world?",
                        options: [
                            { text: "Remain in heavenly glory and send an angel instead", type: "wide" },
                            { text: "Come as a conquering king with armies", type: "wide" },
                            { text: "Be born to royalty in a palace", type: "wide" },
                            { text: "★ Be born in a manger, in humility and weakness", type: "narrow" }
                        ],
                        narrowIndex: 3,
                        feedback: {
                            narrow: "You chose the narrow path! Christ emptied Himself, taking the form of a servant, being born in the likeness of men.",
                            wide: "You strayed from the path. The way of glory and power is the wide path. Christ chose humility."
                        }
                    },
                    scripture: {
                        reference: "Philippians 2:6-8",
                        text: "Who, being in very nature God, did not consider equality with God something to be used to his own advantage; rather, he made himself nothing by taking the very nature of a servant, being made in human likeness. And being found in appearance as a man, he humbled himself by becoming obedient to death—even death on a cross!"
                    }
                },
                {
                    // Chapter 2: The Wilderness
                    title: "Chapter 2: The Wilderness",
                    location: 3, // Wilderness
                    atmosphere: "dark",
                    lines: [
                        { speaker: "Narrator", text: "The Spirit led Jesus into the wilderness to be tempted by the devil. For forty days and forty nights, He fasted, hungering in body but strengthened in spirit." },
                        { speaker: "Satan", text: "If you are the Son of God, command these stones to become bread. Why suffer when you have the power to satisfy yourself?" },
                        { speaker: "Narrator", text: "The first temptation: use divine power for selfish comfort. What will Jesus choose?" }
                    ],
                    choice: {
                        question: "Satan tempts Jesus to turn stones into bread. How should He respond?",
                        options: [
                            { text: "Use divine power to satisfy physical hunger", type: "wide" },
                            { text: "Compromise and turn just one stone to bread", type: "wide" },
                            { text: "★ 'It is written: Man shall not live by bread alone, but by every word from God'", type: "narrow" }
                        ],
                        narrowIndex: 2,
                        feedback: {
                            narrow: "You chose the narrow path! Jesus trusted the Father's provision and refused to use His power selfishly.",
                            wide: "You strayed from the path. Trusting God's provision, not our own power, is the narrow way."
                        }
                    },
                    choice2: {
                        lines: [
                            { speaker: "Satan", text: "Then throw yourself from the pinnacle of the temple! For it is written, 'He will command his angels concerning you.' Prove that God will catch you!" },
                            { speaker: "Narrator", text: "The second temptation: test God's faithfulness, force His hand. What will Jesus choose?" }
                        ],
                        question: "Satan tempts Jesus to test God's protection. How should He respond?",
                        options: [
                            { text: "Jump and force God to prove His love", type: "wide" },
                            { text: "Demand a sign from the Father", type: "wide" },
                            { text: "★ 'It is written: Do not put the Lord your God to the test'", type: "narrow" }
                        ],
                        narrowIndex: 2,
                        feedback: {
                            narrow: "You chose the narrow path! Jesus trusted God without demanding proof.",
                            wide: "You strayed from the path. Faith does not demand signs."
                        }
                    },
                    choice3: {
                        lines: [
                            { speaker: "Satan", text: "All the kingdoms of the world are mine. Bow down and worship me, and I will give them all to you. Skip the cross, take the shortcut to power!" },
                            { speaker: "Narrator", text: "The final temptation: gain the world's kingdoms without the suffering of the cross. What will Jesus choose?" }
                        ],
                        question: "Satan offers all earthly kingdoms in exchange for worship. How should Jesus respond?",
                        options: [
                            { text: "Take the shortcut to avoid the cross", type: "wide" },
                            { text: "Negotiate a compromise with Satan", type: "wide" },
                            { text: "★ 'Away from me, Satan! Worship the Lord your God and serve Him only'", type: "narrow" }
                        ],
                        narrowIndex: 2,
                        feedback: {
                            narrow: "You chose the narrow path! Jesus rejected the easy way and remained faithful to the Father's plan.",
                            wide: "You strayed from the path. There are no shortcuts in God's kingdom."
                        }
                    },
                    scripture: {
                        reference: "Matthew 4:1-11",
                        text: "Then Jesus was led by the Spirit into the wilderness to be tempted by the devil. After fasting forty days and forty nights, he was hungry. The tempter came to him and said, 'If you are the Son of God, tell these stones to become bread.' Jesus answered, 'It is written: Man shall not live on bread alone, but on every word that comes from the mouth of God.'"
                    }
                },
                {
                    // Chapter 3: The Ministry Begins
                    title: "Chapter 3: The Ministry Begins",
                    location: 4, // Sea of Galilee
                    atmosphere: "peaceful",
                    lines: [
                        { speaker: "Narrator", text: "Jesus walked beside the Sea of Galilee. The dawn broke over the water, and fishermen mended their nets after a long night's work." },
                        { speaker: "Jesus", text: "The time has come. The kingdom of God is near. Repent and believe the good news!" },
                        { speaker: "Narrator", text: "He saw Simon and Andrew casting nets into the lake." },
                        { speaker: "Jesus", text: "Come, follow me, and I will make you fishers of men." },
                        { speaker: "Narrator", text: "But how should Jesus build His ministry? What kind of followers should He choose?" }
                    ],
                    choice: {
                        question: "How should Jesus build His ministry and choose His disciples?",
                        options: [
                            { text: "Recruit scholars and religious leaders for credibility", type: "wide" },
                            { text: "Build an army to overthrow Roman occupation", type: "wide" },

        // ===== 3D WORLD SETUP =====
        let scene, camera, renderer, locations = [], particles = [], dayNightCycle = 0;

        function init3DWorld() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Initial camera position
            camera.position.set(0, 50, 100);
            camera.lookAt(0, 0, 0);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 1);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(50, 100, 50);
            scene.add(directionalLight);

            // Desert terrain
            createTerrain();

            // Create 9 biblical locations
            createLocations();

            // Particle systems
            createParticles();

            // Start animation loop
            animate();
        }

        function createTerrain() {
            const geometry = new THREE.PlaneGeometry(500, 500, 50, 50);
            const vertices = geometry.attributes.position.array;
            
            // Displace vertices for terrain
            for (let i = 0; i < vertices.length; i += 3) {
                vertices[i + 2] = Math.random() * 5 - 2; // Random height variation
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({ 
                color: 0xd2b48c,
                roughness: 0.8,
                metalness: 0.2
            });
            const terrain = new THREE.Mesh(geometry, material);
            terrain.rotation.x = -Math.PI / 2;
            scene.add(terrain);
        }

        function createLocations() {
            const locationData = [
                { name: "Bethlehem", pos: [-80, 2, -80], color: 0xffd700, type: "manger" },
                { name: "Nazareth", pos: [-40, 2, -60], color: 0x8b4513, type: "workshop" },
                { name: "Jordan River", pos: [0, 0, -40], color: 0x4169e1, type: "water" },
                { name: "Wilderness", pos: [40, 2, -20], color: 0x2f4f4f, type: "rocks" },
                { name: "Sea of Galilee", pos: [-60, 0, 40], color: 0x1e90ff, type: "sea" },
                { name: "Jerusalem Temple", pos: [0, 10, 60], color: 0xffffff, type: "temple" },
                { name: "Gethsemane", pos: [60, 2, 40], color: 0x228b22, type: "garden" },
                { name: "Golgotha", pos: [80, 8, 0], color: 0x8b0000, type: "cross" },
                { name: "Empty Tomb", pos: [40, 4, 80], color: 0xf0f0f0, type: "tomb" }
            ];

            locationData.forEach((loc, index) => {
                let obj;
                
                switch(loc.type) {
                    case "manger":
                        const mangerGroup = new THREE.Group();
                        const mangerBox = new THREE.Mesh(
                            new THREE.BoxGeometry(6, 3, 4),
                            new THREE.MeshStandardMaterial({ color: loc.color, emissive: loc.color, emissiveIntensity: 0.3 })
                        );
                        mangerGroup.add(mangerBox);
                        obj = mangerGroup;
                        break;
                    
                    case "water":
                    case "sea":
                        obj = new THREE.Mesh(
                            new THREE.PlaneGeometry(20, 20),
                            new THREE.MeshStandardMaterial({ color: loc.color, emissive: loc.color, emissiveIntensity: 0.2, transparent: true, opacity: 0.7 })
                        );
                        obj.rotation.x = -Math.PI / 2;
                        break;
                    
                    case "temple":
                        obj = new THREE.Mesh(
                            new THREE.BoxGeometry(15, 20, 15),
                            new THREE.MeshStandardMaterial({ color: loc.color, emissive: loc.color, emissiveIntensity: 0.4 })
                        );
                        break;
                    
                    case "cross":
                        const crossGroup = new THREE.Group();
                        const vertical = new THREE.Mesh(
                            new THREE.BoxGeometry(1, 12, 1),
                            new THREE.MeshStandardMaterial({ color: loc.color, emissive: loc.color, emissiveIntensity: 0.3 })
                        );
                        const horizontal = new THREE.Mesh(
                            new THREE.BoxGeometry(8, 1, 1),
                            new THREE.MeshStandardMaterial({ color: loc.color, emissive: loc.color, emissiveIntensity: 0.3 })
                        );
                        horizontal.position.y = 4;
                        crossGroup.add(vertical);
                        crossGroup.add(horizontal);
                        obj = crossGroup;
                        break;
                    
                    case "tomb":
                        obj = new THREE.Mesh(
                            new THREE.CylinderGeometry(4, 4, 6, 8),
                            new THREE.MeshStandardMaterial({ color: loc.color, emissive: loc.color, emissiveIntensity: 0.5 })
                        );
                        break;
                    
                    case "garden":
                        const gardenGroup = new THREE.Group();
                        for (let i = 0; i < 3; i++) {
                            const tree = new THREE.Mesh(
                                new THREE.ConeGeometry(2, 6, 8),
                                new THREE.MeshStandardMaterial({ color: loc.color, emissive: loc.color, emissiveIntensity: 0.2 })
                            );
                            tree.position.x = (i - 1) * 5;
                            tree.position.y = 3;
                            gardenGroup.add(tree);
                        }
                        obj = gardenGroup;
                        break;
                    
                    default:
                        obj = new THREE.Mesh(
                            new THREE.BoxGeometry(5, 5, 5),
                            new THREE.MeshStandardMaterial({ color: loc.color, emissive: loc.color, emissiveIntensity: 0.3 })
                        );
                }
                
                obj.position.set(loc.pos[0], loc.pos[1], loc.pos[2]);
                scene.add(obj);
                locations.push({ name: loc.name, object: obj, position: loc.pos });
            });
        }

        function createParticles() {
            const particleTypes = [
                { color: 0xffd700, count: 100, name: "divine" }, // Gold divine light
                { color: 0xff4500, count: 50, name: "fire" },    // Fire
                { color: 0x4169e1, count: 50, name: "water" },   // Water
                { color: 0xffffff, count: 200, name: "stars" }   // Stars
            ];

            particleTypes.forEach(type => {
                const geometry = new THREE.BufferGeometry();
                const positions = [];
                const velocities = [];

                for (let i = 0; i < type.count; i++) {
                    positions.push(
                        (Math.random() - 0.5) * 200,
                        Math.random() * 100,
                        (Math.random() - 0.5) * 200
                    );
                    velocities.push(
                        (Math.random() - 0.5) * 0.1,
                        Math.random() * 0.1,
                        (Math.random() - 0.5) * 0.1
                    );
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

                const material = new THREE.PointsMaterial({
                    color: type.color,
                    size: type.name === "stars" ? 0.5 : 1,
                    transparent: true,
                    opacity: type.name === "stars" ? 0.8 : 0.6
                });

                const particleSystem = new THREE.Points(geometry, material);
                particleSystem.userData = { velocities, type: type.name, visible: type.name === "stars" };
                particleSystem.visible = type.name === "stars";
                scene.add(particleSystem);
                particles.push(particleSystem);
            });
        }

        function updateAtmosphere(type) {
            const atmospheres = {
                divine: { sky: 0xffd700, ambient: 0.8, directional: 0xffffff, particles: ["divine", "stars"] },
                dark: { sky: 0x1a1a1a, ambient: 0.3, directional: 0x8b0000, particles: ["fire"] },
                peaceful: { sky: 0x87ceeb, ambient: 0.6, directional: 0xfffacd, particles: ["water", "stars"] },
                tense: { sky: 0x696969, ambient: 0.4, directional: 0xff4500, particles: [] }
            };

            const atm = atmospheres[type] || atmospheres.peaceful;

            // Update scene
            scene.fog = new THREE.Fog(atm.sky, 50, 200);
            scene.background = new THREE.Color(atm.sky);

            // Update lights
            const ambientLight = scene.children.find(child => child instanceof THREE.AmbientLight);
            if (ambientLight) ambientLight.intensity = atm.ambient;

            const directionalLight = scene.children.find(child => child instanceof THREE.DirectionalLight);
            if (directionalLight) directionalLight.color = new THREE.Color(atm.directional);

            // Update particles
            particles.forEach(p => {
                p.visible = atm.particles.includes(p.userData.type);
            });
        }

        function moveCameraToLocation(index) {
            if (!locations[index]) return;

            const targetPos = locations[index].position;
            const startPos = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
            const endPos = { 
                x: targetPos[0] + 30, 
                y: targetPos[1] + 30, 
                z: targetPos[2] + 50 
            };

            let progress = 0;
            const duration = 2000; // 2 seconds
            const startTime = Date.now();

            function animateCamera() {
                const elapsed = Date.now() - startTime;
                progress = Math.min(elapsed / duration, 1);

                // Smooth easing
                const eased = progress < 0.5 
                    ? 2 * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                camera.position.x = startPos.x + (endPos.x - startPos.x) * eased;
                camera.position.y = startPos.y + (endPos.y - startPos.y) * eased;
                camera.position.z = startPos.z + (endPos.z - startPos.z) * eased;

                camera.lookAt(targetPos[0], targetPos[1], targetPos[2]);

                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }

            animateCamera();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Update particles
            particles.forEach(p => {
                if (!p.visible) return;
                
                const positions = p.geometry.attributes.position.array;
                const velocities = p.userData.velocities;

                for (let i = 0; i < positions.length; i += 3) {
                    positions[i] += velocities[i];
                    positions[i + 1] += velocities[i + 1];
                    positions[i + 2] += velocities[i + 2];

                    // Reset if out of bounds
                    if (Math.abs(positions[i]) > 100 || positions[i + 1] > 100 || positions[i + 1] < 0) {
                        positions[i] = (Math.random() - 0.5) * 200;
                        positions[i + 1] = Math.random() * 100;
                        positions[i + 2] = (Math.random() - 0.5) * 200;
                    }
                }

                p.geometry.attributes.position.needsUpdate = true;
            });

            // Day/night cycle (subtle)
            dayNightCycle += 0.001;
            const skyBrightness = (Math.sin(dayNightCycle) + 1) / 2;

            renderer.render(scene, camera);
        }

            camera.aspect = window.innerWidth / window.innerHeight;

        function initAudio() {
            game.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            game.volume = document.getElementById('volume-slider').value / 100;

            document.getElementById('volume-slider').addEventListener('input', (e) => {
                game.volume = e.target.value / 100;
            });
        }

        function playSound(type) {
            if (!game.audioContext) return;

            // Stop current sound
            if (game.currentSound) {
                try {
                    game.currentSound.stop();
                } catch (e) {}
            }

            const ctx = game.audioContext;
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);

            gainNode.gain.value = game.volume * 0.1;

            const sounds = {
                peaceful: { type: 'sine', freq: 220 },
                tense: { type: 'sawtooth', freq: 110 },
                divine: { type: 'sine', freq: 440 },
                dark: { type: 'triangle', freq: 55 }
            };

            const sound = sounds[type] || sounds.peaceful;
            oscillator.type = sound.type;
            oscillator.frequency.value = sound.freq;

            oscillator.start();
            game.currentSound = oscillator;

            // Fade out after 3 seconds
            setTimeout(() => {
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
                setTimeout(() => {
                    try {
                        oscillator.stop();
                    } catch (e) {}
                }, 2000);
            }, 3000);
        }

        // ===== UI FUNCTIONS =====
        function typewriterEffect(text, element, callback) {
            if (game.typewriterActive) return;
            
            game.typewriterActive = true;
            element.textContent = '';
            let i = 0;

            const interval = setInterval(() => {
                if (i < text.length) {
                    element.textContent += text[i];
                    i++;
                } else {
                    clearInterval(interval);
                    game.typewriterActive = false;
                    if (callback) callback();
                }
            }, 30);
        }

            if (achievement && !achievement.unlocked) {
                achievement.unlocked = true;
                game.unlockedAchievements.push(id);
                showAchievement(achievement);
                saveGame('auto');
            }
        }

        // ===== GAME LOGIC =====
        function startChapter(chapterIndex) {
            if (chapterIndex >= story.chapters.length) {
                endGame();
                return;
            }

            game.currentChapter = chapterIndex;
            game.currentLine = 0;

            const chapter = story.chapters[chapterIndex];

            fadeTransition(() => {
                updateHUD();
                moveCameraToLocation(chapter.location);
                updateAtmosphere(chapter.atmosphere);
                playSound(chapter.atmosphere);
                
                setTimeout(() => {
                    showNextLine();
                }, 500);
            });
        }

        function showNextLine() {
            const chapter = story.chapters[game.currentChapter];
            
            if (game.currentLine < chapter.lines.length) {
                const line = chapter.lines[game.currentLine];
                showDialogue(line.speaker, line.text, () => {
                    // Wait for click to continue
                });
                game.currentLine++;
            } else if (chapter.choice) {
                // Show choices
                hideDialogue();
                showChoices(chapter.choice, handleChoice);
            } else {
                // Chapter complete (final chapter)
                completeChapter();
            }
        }

        function handleChoice(choiceIndex, isNarrow) {
            const chapter = story.chapters[game.currentChapter];
            const feedback = isNarrow ? chapter.choice.feedback.narrow : chapter.choice.feedback.wide;

            // Track choice
            game.choices.push({ chapter: game.currentChapter, choice: choiceIndex, narrow: isNarrow });
            game.pathData.choices.push({ chapter: game.currentChapter, narrow: isNarrow });

            if (isNarrow) {
                game.pathData.narrow++;
                game.streak++;
                const xpGain = 100 * game.streak;
                game.xp += xpGain;
                showXPGain(xpGain, true);
            } else {
                game.pathData.wide++;
                game.streak = 0;
                game.xp += 10;
                showXPGain(10, false);
            }

            updateHUD();

            // Show feedback
            showDialogue("Narrator", feedback, () => {
                // Check for multi-choice chapters (Chapter 2 - Wilderness)
                if (game.currentChapter === 1) {
                    handleWildernessChoices(isNarrow);
                } else {
                    completeChapter();
                }
            });
        }

        let wildernessChoiceCount = 0;
        let wildernessNarrowCount = 0;

        function handleWildernessChoices(wasNarrow) {
            wildernessChoiceCount++;
            if (wasNarrow) wildernessNarrowCount++;

            const chapter = story.chapters[1];

            if (wildernessChoiceCount === 1 && chapter.choice2) {
                // Show second temptation
                setTimeout(() => {
                    const lines = chapter.choice2.lines;
                    let lineIndex = 0;

                    function showWildernessLine() {
                        if (lineIndex < lines.length) {
                            showDialogue(lines[lineIndex].speaker, lines[lineIndex].text, () => {
                                lineIndex++;
                                setTimeout(showWildernessLine, 100);
                            });
                        } else {
                            hideDialogue();
                            showChoices(chapter.choice2, (idx, narrow) => {
                                game.choices.push({ chapter: 1, choice: idx, narrow });
                                game.pathData.choices.push({ chapter: 1, narrow });
                                
                                if (narrow) {
                                    game.pathData.narrow++;
                                    game.streak++;
                                    const xpGain = 100 * game.streak;
                                    game.xp += xpGain;
                                    showXPGain(xpGain, true);
                                    wildernessNarrowCount++;
                                } else {
                                    game.pathData.wide++;
                                    game.streak = 0;
                                    game.xp += 10;
                                    showXPGain(10, false);
                                }

                                updateHUD();
                                const feedback = narrow ? chapter.choice2.feedback.narrow : chapter.choice2.feedback.wide;
                                showDialogue("Narrator", feedback, () => {
                                    handleWildernessChoices(narrow);
                                });
                            });
                        }
                    }

                    showWildernessLine();
                }, 1000);
            } else if (wildernessChoiceCount === 2 && chapter.choice3) {
                // Show third temptation
                setTimeout(() => {
                    const lines = chapter.choice3.lines;
                    let lineIndex = 0;

                    function showWildernessLine() {
                        if (lineIndex < lines.length) {
                            showDialogue(lines[lineIndex].speaker, lines[lineIndex].text, () => {
                                lineIndex++;
                                setTimeout(showWildernessLine, 100);
                            });
                        } else {
                            hideDialogue();
                            showChoices(chapter.choice3, (idx, narrow) => {
                                game.choices.push({ chapter: 1, choice: idx, narrow });
                                game.pathData.choices.push({ chapter: 1, narrow });
                                
                                if (narrow) {
                                    game.pathData.narrow++;
                                    game.streak++;
                                    const xpGain = 100 * game.streak;
                                    game.xp += xpGain;
                                    showXPGain(xpGain, true);
                                    wildernessNarrowCount++;
                                } else {
                                    game.pathData.wide++;
                                    game.streak = 0;
                                    game.xp += 10;
                                    showXPGain(10, false);
                                }

                                updateHUD();
                                const feedback = narrow ? chapter.choice3.feedback.narrow : chapter.choice3.feedback.wide;
                                showDialogue("Narrator", feedback, () => {
                                    // Check overcomer achievement
                                    if (wildernessNarrowCount === 3) {
                                        unlockAchievement("overcomer");
                                    }
                                    wildernessChoiceCount = 0;
                                    wildernessNarrowCount = 0;
                                    completeChapter();
                                });
                            });
                        }
                    }

                    showWildernessLine();
                }, 1000);
            }
        }

        function completeChapter() {
            const chapter = story.chapters[game.currentChapter];

            // Collect scripture verse
            if (chapter.scripture && !game.collectedVerses.find(v => v.reference === chapter.scripture.reference)) {
                game.collectedVerses.push(chapter.scripture);
            }

            // Chapter-specific achievements
            if (game.currentChapter === 0) unlockAchievement("first_steps");
            if (game.currentChapter === 2) unlockAchievement("fisher_of_men");
            if (game.currentChapter === 4) unlockAchievement("truth_speaker");
            if (game.currentChapter === 5) unlockAchievement("not_my_will");

            // Check if all narrow paths chosen
            const allNarrow = game.pathData.choices.every(c => c.narrow);
            if (allNarrow && game.currentChapter === story.chapters.length - 1) {
                unlockAchievement("narrow_way");
            }

            // Check scripture collection
            if (game.collectedVerses.length === story.chapters.length) {
                unlockAchievement("scripture_scholar");
            }

            saveGame('auto');

            setTimeout(() => {
                if (game.currentChapter < story.chapters.length - 1) {
                    startChapter(game.currentChapter + 1);
                } else {
                    unlockAchievement("the_way");
                    endGame();
                }
            }, 2000);
        }

        function endGame() {
            fadeTransition(() => {
                hideDialogue();
                const finalText = `
                    Journey Complete
                    
                    You have walked the path from Bethlehem to the Empty Tomb.
                    
                    Total XP: ${game.xp}
                    Narrow Paths Chosen: ${game.pathData.narrow}
                    Wide Paths Chosen: ${game.pathData.wide}
                    Achievements: ${game.unlockedAchievements.length}/${achievements.length}
                    
                    "I am the way, the truth, and the life. 
                    No one comes to the Father except through me."
                    - John 14:6
                    
                    The narrow gate is not a path to follow—
                    Jesus IS the gate.
                    
                    Will you enter?
                `;

                showDialogue("The End", finalText, () => {
                    // Show menu to restart or review
                });
            });
        }

        // ===== SAVE/LOAD SYSTEM =====
        function saveGame(slot) {
            const saveData = {
                chapter: game.currentChapter,
                xp: game.xp,
                streak: game.streak,
                choices: game.choices,
                achievements: game.unlockedAchievements,
                verses: game.collectedVerses,
                pathData: game.pathData,
                timestamp: Date.now()
            };

            localStorage.setItem('narrowway_save_' + slot, JSON.stringify(saveData));
            updateSaveSlots();
        }

        function loadGame(slot) {
            const saveData = localStorage.getItem('narrowway_save_' + slot);
            if (!saveData) return false;

            const data = JSON.parse(saveData);
            game.currentChapter = data.chapter;
            game.xp = data.xp;
            game.streak = data.streak;
            game.choices = data.choices;
            game.unlockedAchievements = data.achievements;
            game.collectedVerses = data.verses;
            game.pathData = data.pathData;

            // Update achievements
            achievements.forEach(a => {
                a.unlocked = game.unlockedAchievements.includes(a.id);
            });

            updateHUD();
            game.closeMenu();
            startChapter(game.currentChapter);
            return true;
        }

        function updateSaveSlots() {
            for (let i = 0; i < 3; i++) {
                const saveData = localStorage.getItem('narrowway_save_' + i);
                const slotEl = document.getElementById('slot-' + i);
                
                if (saveData) {
                    const data = JSON.parse(saveData);
                    const date = new Date(data.timestamp);
                    slotEl.textContent = `Chapter ${data.chapter + 1} - ${date.toLocaleDateString()}`;
                    slotEl.parentElement.classList.remove('empty');
                } else {
                    slotEl.textContent = 'Empty';
                    slotEl.parentElement.classList.add('empty');
                }
            }
        }

        // ===== MENU FUNCTIONS =====
        game.showMenu = function() {
            document.getElementById('menu-overlay').classList.add('visible');
            document.querySelectorAll('#menu-content > div').forEach(el => {
                if (el.id !== 'volume-control') el.style.display = 'none';
            });
            document.querySelectorAll('.menu-btn').forEach(btn => btn.style.display = 'block');
            updateSaveSlots();
        };

        game.closeMenu = function() {
            document.getElementById('menu-overlay').classList.remove('visible');
        };

        game.showSaveLoad = function(mode) {
            game.saveLoadMode = mode;
            document.querySelectorAll('.menu-btn').forEach(btn => btn.style.display = 'none');
            document.getElementById('save-load-view').style.display = 'block';
            document.getElementById('save-load-title').textContent = mode === 'save' ? 'Save Game' : 'Load Game';
            updateSaveSlots();
        };

        game.handleSaveLoad = function(slot) {
            if (game.saveLoadMode === 'save') {
                saveGame(slot);
                alert('Game saved to slot ' + (slot + 1));
            } else {
                if (loadGame(slot)) {
                    alert('Game loaded from slot ' + (slot + 1));
                } else {
                    alert('No save data in slot ' + (slot + 1));
                }
            }
        };

        game.backToMainMenu = function() {
            document.querySelectorAll('#menu-content > div').forEach(el => {
                if (el.id !== 'volume-control') el.style.display = 'none';
            });
            document.querySelectorAll('.menu-btn').forEach(btn => btn.style.display = 'block');
        };

        game.showAchievements = function() {
            document.querySelectorAll('.menu-btn').forEach(btn => btn.style.display = 'none');
            const container = document.getElementById('achievements-container');
            container.innerHTML = '';
            container.classList.add('visible');

            achievements.forEach(a => {
                const div = document.createElement('div');
                div.className = 'achievement-item' + (a.unlocked ? ' unlocked' : '');
                div.innerHTML = `
                    <div class="achievement-icon">${a.icon}</div>
                    <div>
                        <div style="font-weight: bold; color: ${a.unlocked ? '#ffd700' : '#888'};">${a.name}</div>
                        <div style="font-size: 14px; color: #aaa;">${a.description}</div>
                    </div>
                `;
                container.appendChild(div);
            });

            const backBtn = document.createElement('button');
            backBtn.className = 'menu-btn';
            backBtn.textContent = 'Back';
            backBtn.onclick = game.backToMainMenu;
            container.appendChild(backBtn);
        };

        game.showVerses = function() {
            document.querySelectorAll('.menu-btn').forEach(btn => btn.style.display = 'none');
            const container = document.getElementById('verses-container');
            container.innerHTML = '';
            container.classList.add('visible');

            if (game.collectedVerses.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #888;">No verses collected yet.</p>';
            } else {
                game.collectedVerses.forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'verse-card';
                    card.innerHTML = `
                        <h4>${v.reference}</h4>
                        <p>${v.text}</p>
                    `;
                    container.appendChild(card);
                });
            }

            const backBtn = document.createElement('button');
            backBtn.className = 'menu-btn';
            backBtn.textContent = 'Back';
            backBtn.onclick = game.backToMainMenu;
            container.appendChild(backBtn);
        };

        game.showPathMap = function() {
            document.querySelectorAll('.menu-btn').forEach(btn => btn.style.display = 'none');
            document.getElementById('path-map-container').classList.add('visible');

            const canvas = document.getElementById('path-canvas');
            const ctx = canvas.getContext('2d');

            // Clear canvas
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw paths
            const width = canvas.width;
            const height = canvas.height;
            const stepX = width / (game.pathData.choices.length + 1);

            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(stepX, height / 2);

            game.pathData.choices.forEach((choice, i) => {
                const x = stepX * (i + 2);
                const y = choice.narrow ? height / 3 : (height / 3) * 2;
                ctx.lineTo(x, y);
                
                // Draw point
                ctx.fillStyle = choice.narrow ? '#ffd700' : '#dc143c';
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = choice.narrow ? '#ffd700' : '#dc143c';
                ctx.beginPath();
                ctx.moveTo(x, y);
            });

            ctx.stroke();

            // Labels
            ctx.fillStyle = '#ffd700';
            ctx.font = '16px Georgia';
            ctx.textAlign = 'center';
            ctx.fillText('The Narrow Way', width / 2, 30);
            ctx.fillStyle = '#888';
            ctx.font = '14px Georgia';
            ctx.fillText(`${game.pathData.narrow} Narrow / ${game.pathData.wide} Wide`, width / 2, 50);
        };

        // ===== EVENT LISTENERS =====
        document.getElementById('dialogue-container').addEventListener('click', () => {
            if (!game.typewriterActive) {
                showNextLine();
            }
        });

        document.getElementById('menu-btn').addEventListener('click', () => {
            game.showMenu();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                if (!game.typewriterActive && document.getElementById('dialogue-container').classList.contains('visible')) {
                    showNextLine();
                }
            }
            if (e.key === 'Escape') {
                if (document.getElementById('menu-overlay').classList.contains('visible')) {
                    game.closeMenu();
                } else {
                    game.showMenu();
                }
            }
        });

        // ===== INITIALIZATION =====
        window.addEventListener('load', () => {
            init3DWorld();
            initAudio();
            
            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                setTimeout(() => {
                    startChapter(0);
                }, 1000);
            }, 2000);
        });
    </script>
</body>
</html>
