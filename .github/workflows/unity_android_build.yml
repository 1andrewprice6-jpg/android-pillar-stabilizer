name: Build Godot Android

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.4"
      GODOT_RELEASE: "stable"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          FILENAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${FILENAME}.zip"
          unzip -q "${FILENAME}.zip"
          chmod +x "${FILENAME}"
          sudo mv "${FILENAME}" /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          TPZ="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${TPZ}"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          unzip -q "${TPZ}"
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/

      - name: Generate Android debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android SDK path
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << 'EOF'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_pass = "android"
          export/android/debug_keystore_user = "androiddebugkey"
          EOF

      - name: Build Android APK
        run: |
          mkdir -p build/Android
          godot --headless --export-debug "Android" \
            "$PWD/build/Android/NEON_PROTOCOL_ANDROID.apk" \
            --path "$PWD/NEONPROTOCOL"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: build/Android
