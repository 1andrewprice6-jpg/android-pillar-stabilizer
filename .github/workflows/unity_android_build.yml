# Required repository secrets (Settings → Secrets and variables → Actions):
#   Personal license: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
#   Pro / Plus:       UNITY_SERIAL,  UNITY_EMAIL, UNITY_PASSWORD
# Optional (Android signing): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS,
#                             ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS

name: Build Unity Android

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: NEONPROTOCOL/Library
          key: Library-${{ hashFiles('NEONPROTOCOL/Assets/**', 'NEONPROTOCOL/Packages/**', 'NEONPROTOCOL/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Check Unity credentials
        id: license_check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            IS_FORK_PR=false
            if [ "${{ github.event_name }}" = "pull_request" ] && \
               [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              IS_FORK_PR=true
            fi
            if [ "$IS_FORK_PR" = "true" ]; then
              echo "::warning::Unity license secrets are not available on fork PRs. The build step will be skipped."
            else
              MSG="Unity license secrets are not configured."
              MSG="${MSG}%0AAdd one of the following sets of secrets under Settings → Secrets and variables → Actions:"
              MSG="${MSG}%0A  Personal license: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD"
              MSG="${MSG}%0A  Pro / Plus:       UNITY_SERIAL,  UNITY_EMAIL, UNITY_PASSWORD"
              MSG="${MSG}%0ASee https://game.ci/docs/github/activation for activation steps."
              echo "::error::${MSG}"
              exit 1
            fi
          fi

      - name: Build Android
        if: steps.license_check.outputs.has_license == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          projectPath: NEONPROTOCOL
          buildName: NEON_PROTOCOL_ANDROID
          androidAppBundle: false
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Upload build
        if: steps.license_check.outputs.has_license == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: build/Android
